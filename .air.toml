root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/modos-cpu"
  cmd = "go build -o ./tmp/modos-cpu ./cmd/modos-cpu"
  delay = 200
  exclude_dir = ["bin", "tmp", "web", "internal/staticui/dist", "books", "deploy", "deploy.local", "docs"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[color]
  app = "white"
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[misc]
  clean_on_exit = true
