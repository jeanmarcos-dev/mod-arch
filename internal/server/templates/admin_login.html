<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · MODOS_CPU</title>
  <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/_assets/admin_login.css">
</head>
<body>
  <div class="box">
    <h1>▸ ADMIN</h1>
    <p class="sub">Acceso a la consola de gestión de sesiones de MODOS_CPU.</p>
    {{if .Error}}<div class="err">✗ Credenciales inválidas</div>{{end}}
    <form method="post" action="/admin/login">
      <label>Usuario</label>
      <input type="text" name="user" autocomplete="username" autofocus required>
      <label>Contraseña</label>
      <input type="password" name="pass" autocomplete="current-password" required>
      <button type="submit">▸ INGRESAR</button>
    </form>
    <div class="footer"><a href="/">← Volver al simulador</a></div>
  </div>
</body>
</html>
