<!doctype html>
<html lang="{{ .Lang }}">
<head>
  <meta charset="utf-8">
  <title>{{ T .Lang "viewer_password.title_tab" }}</title>
  <link rel="stylesheet" href="/_assets/viewer_password.css">
</head>
<body>
  <div class="card">
    <h1>{{ T .Lang "viewer_password.heading" }}</h1>
    <p>{{ T .Lang "viewer_password.lead" }}</p>
    {{ if .Error }}<p class="err">{{ .Error }}</p>{{ end }}
    <form method="post" action="/v/{{ .Token }}/auth">
      <label>
        {{ T .Lang "viewer_password.label" }}
        <input name="password" type="password" autofocus required>
      </label>
      <button type="submit">{{ T .Lang "viewer_password.submit" }}</button>
    </form>
  </div>
</body>
</html>
