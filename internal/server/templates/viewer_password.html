<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Acceso · MODOS-CPU</title>
  <link rel="stylesheet" href="/_assets/viewer_password.css">
</head>
<body>
  <div class="card">
    <h1>VISTA RESTRINGIDA</h1>
    <p>Esta sesión compartida requiere una contraseña para ser observada.</p>
    {{ if .Error }}<p class="err">{{ .Error }}</p>{{ end }}
    <form method="post" action="/v/{{ .Token }}/auth">
      <label>
        Contraseña
        <input name="password" type="password" autofocus required>
      </label>
      <button type="submit">INGRESAR</button>
    </form>
  </div>
</body>
</html>
