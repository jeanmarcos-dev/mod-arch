version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocyclo
    - gocognit
    - unconvert
    - bodyclose
    - errorlint
    - nilerr
    - nolintlint

  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    revive:
      rules:
        - name: var-naming
        - name: receiver-naming
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: superfluous-else
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
    errcheck:
      check-type-assertions: false
      check-blank: false

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jeanmarcos-dev/mod-arch
