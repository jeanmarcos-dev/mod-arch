    <line x1="28" y1="50" x2="28" y2="55"/>
    <line x1="36" y1="50" x2="36" y2="55"/>
    <line x1="44" y1="50" x2="44" y2="55"/>
    <line x1="9"  y1="20" x2="14" y2="20"/>
    <line x1="9"  y1="28" x2="14" y2="28"/>
    <line x1="9"  y1="36" x2="14" y2="36"/>
    <line x1="9"  y1="44" x2="14" y2="44"/>
